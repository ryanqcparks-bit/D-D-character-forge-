services:
  - type: web
    name: character-forge
    env: static
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_OPTIONS
        value: --max_old_space_size=400
